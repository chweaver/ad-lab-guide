site_name: AD Lab Foundations
site_description: A reproducible Active Directory home lab guide, built for CompTIA A+ Core 2 prep and portfolio.
site_author: chweaver

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - redirects:
      redirect_maps:
        build-out/phase-01-install.md: build-out/phase-01-build-the-dc.md
        build-out/phase-02-pre-promotion.md: build-out/phase-01-build-the-dc.md
        build-out/phase-03-promote.md: build-out/phase-01-build-the-dc.md
        build-out/phase-04-ou.md: build-out/phase-02-directory-structure.md
        build-out/phase-05-users.md: build-out/phase-02-directory-structure.md
        build-out/phase-06-groups.md: build-out/phase-02-directory-structure.md
        build-out/phase-07-join-client.md: build-out/phase-03-join-client.md
        build-out/phase-08-gpo.md: build-out/phase-04-group-policy.md
        build-out/phase-09-shares.md: build-out/phase-05-file-services.md
        build-out/phase-10-home-folders.md: build-out/phase-05-file-services.md
        build-out/phase-11-scripts.md: build-out/phase-06-logon-scripts.md
        build-out/phase-12-helpdesk.md: build-out/phase-07-helpdesk.md
        stretch/phase-15-backup.md: planned/phase-15-backup.md
        stretch/phase-16-second-dc.md: planned/phase-16-second-dc.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true
      use_pygments: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Lab Map: lab-map.md
  - Reference: reference.md
  - Build-out:
    - Phase 1 - Build the DC: build-out/phase-01-build-the-dc.md
    - Phase 2 - OUs, users, AGDLP: build-out/phase-02-directory-structure.md
    - Phase 3 - Join client WS01: build-out/phase-03-join-client.md
    - Phase 4 - Group Policy basics: build-out/phase-04-group-policy.md
    - Phase 5 - File services: build-out/phase-05-file-services.md
    - Phase 6 - Login scripts and drive maps: build-out/phase-06-logon-scripts.md
    - Phase 7 - Help-desk admin drills: build-out/phase-07-helpdesk.md
  - Planned:
    - Phase 8 - GPO security baseline: planned/phase-08-gpo-baseline.md
    - Phase 9 - Departmental file server: planned/phase-09-dept-file-server.md
    - Phase 10 - Scripted patching: planned/phase-10-patching.md
    - Phase 15 - AD backup and restore: planned/phase-15-backup.md
    - Phase 16 - Second DC on Server 2025: planned/phase-16-second-dc.md
  - Stretch:
    - Phase 13 - DHCP role: stretch/phase-13-dhcp.md
    - Phase 14 - RDP and remote access: stretch/phase-14-rdp.md
    - Phase 17 - Entra Connect hybrid identity: stretch/phase-17-entra-connect.md
  - Next Lab Series: next-lab-series.md
  - Exam notes: exam-notes.md
  - Gotchas: gotchas.md
